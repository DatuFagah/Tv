<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY TV Malaysia</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    text-align:center;
    padding:20px;
    background:#111;
    border-bottom:2px solid #222;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    color:#888;
    margin:8px 0 0;
}

/* TV */

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.tv{
    background:linear-gradient(145deg,#444,#111);
    border:10px solid #252525;
    border-radius:30px;
    padding:15px;
    box-shadow:
        0 0 0 3px #555,
        0 20px 50px #000;
}

.screen{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:8px;
    overflow:hidden;
}

.screen iframe{
    width:100%;
    height:100%;
    border:0;
}

.screen-message{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:#050505;
    text-align:center;
    padding:20px;
}

.screen-message h2{
    margin:0 0 10px;
}

.watch-button{
    background:#e60000;
    color:white;
    padding:12px 20px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
}

.live{
    position:absolute;
    top:12px;
    left:12px;
    z-index:5;
    background:red;
    padding:6px 10px;
    border-radius:5px;
    font-size:12px;
    font-weight:bold;
}

.channel-name{
    background:#111;
    padding:15px;
    font-size:20px;
    font-weight:bold;
}

.tv-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 5px 0;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.logo span{
    color:#00bfff;
}

.power{
    width:13px;
    height:13px;
    background:red;
    border-radius:50%;
    box-shadow:0 0 15px red;
}

/* CHANNEL */

.title{
    margin-top:30px;
    font-size:25px;
    font-weight:bold;
}

.channels{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:18px;
}

.channel{
    background:#151515;
    border:2px solid #292929;
    border-radius:14px;
    padding:20px 10px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.channel:hover{
    border-color:#00bfff;
    transform:translateY(-3px);
}

.icon{
    font-size:35px;
}

.name{
    margin-top:8px;
    font-weight:bold;
}

.badge{
    display:inline-block;
    margin-top:9px;
    padding:5px 8px;
    border-radius:5px;
    background:#e60000;
    font-size:10px;
}

/* MOBILE */

@media(max-width:600px){

    .container{
        padding:8px;
    }

    .tv{
        border-width:6px;
        padding:7px;
        border-radius:20px;
    }

    .channels{
        grid-template-columns:repeat(2,1fr);
    }

    .title{
        font-size:22px;
    }

    .name{
        font-size:15px;
    }
}
</style>
</head>
