<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">

<title>Dibuat Rindu ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Georgia, "Times New Roman", serif;
}

/* =========================
   VIDEO
========================= */

#video {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 1;

    background: #000;
}

/* =========================
   OVERLAY
========================= */

.overlay {
    position: fixed;
    inset: 0;

    z-index: 2;

    pointer-events: none;

    background:
        radial-gradient(
            circle at center,
            rgba(255, 80, 130, 0.04),
            rgba(0, 0, 0, 0.20) 45%,
            rgba(0, 0, 0, 0.72) 100%
        );
}

/* =========================
   GLOW
========================= */

.glow {
    position: fixed;
    inset: 0;

    z-index: 3;

    pointer-events: none;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(255, 120, 170, 0.15),
            transparent 48%
        );

    animation: glow 4s ease-in-out infinite;
}

@keyframes glow {

    0%,
    100% {
        opacity: .45;
        transform: scale(1);
    }

    50% {
        opacity: 1;
        transform: scale(1.08);
    }
}

/* =========================
   TEKS
========================= */

.content {
    position: fixed;
    inset: 0;

    z-index: 10;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    color: white;

    padding: 25px;

    pointer-events: none;
}

.small {
    font-family: Arial, sans-serif;

    font-size: 12px;

    letter-spacing: 6px;

    text-transform: uppercase;

    opacity: .9;

    margin-bottom: 16px;

    text-shadow:
        0 0 10px rgba(255, 120, 170, .8);
}

h1 {
    font-size: clamp(48px, 10vw, 100px);

    font-weight: normal;

    letter-spacing: 4px;

    text-shadow:
        0 0 10px rgba(255, 255, 255, .8),
        0 0 30px rgba(255, 100, 160, .8),
        0 0 70px rgba(255, 50, 130, .6);

    animation: title 3s ease-in-out infinite;
}

.subtitle {
    margin-top: 22px;

    max-width: 800px;

    font-size: clamp(15px, 3vw, 24px);

    letter-spacing: 1.5px;

    line-height: 1.8;

    text-shadow:
        0 2px 12px #000,
        0 0 20px rgba(255, 100, 150, .6);
}

@keyframes title {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.025);
    }
}

/* =========================
   BUNGA / KELOPAK
========================= */

#flowers {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 30;

    overflow: hidden;

    pointer-events: none;
}

/*
   Setiap bunga menggunakan 5 kelopak.
   Ini membuat bunga benar-benar kelihatan,
   bukan hanya bergantung kepada emoji.
*/

.flower {
    position: absolute;

    top: -80px;

    width: 24px;
    height: 24px;

    opacity: 0;

    animation:
        flowerFall var(--duration) linear forwards;

    filter:
        drop-shadow(0 0 5px rgba(255, 120, 170, .9))
        drop-shadow(0 0 12px rgba(255, 60, 130, .5));
}

/* Kelopak bunga */

.flower .petal {
    position: absolute;

    width: 12px;
    height: 18px;

    left: 6px;
    top: 2px;

    border-radius:
        70% 70% 45% 45%;

    background:
        radial-gradient(
            circle at 50% 15%,
            #ffffff 0%,
            #ffd8e6 18%,
            #ff9cbd 42%,
            #ff4b8c 72%,
            #b91858 100%
        );

    transform-origin: 50% 100%;
}

/* 5 kelopak */

.flower .petal:nth-child(1) {
    transform: rotate(0deg);
}

.flower .petal:nth-child(2) {
    transform: rotate(72deg);
}

.flower .petal:nth-child(3) {
    transform: rotate(144deg);
}

.flower .petal:nth-child(4) {
    transform: rotate(216deg);
}

.flower .petal:nth-child(5) {
    transform: rotate(288deg);
}

/* Tengah bunga */

.flower .flower-center {
    position: absolute;

    width: 7px;
    height: 7px;

    left: 8.5px;
    top: 8.5px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fffbd0,
            #ffd447 55%,
            #d78900
        );

    z-index: 10;

    box-shadow:
        0 0 5px #fff,
        0 0 12px #ffd35a;
}

/* =========================
   ANIMASI BUNGA
========================= */

@keyframes flowerFall {

    0% {
        transform:
            translate3d(0, -100px, 0)
            rotate(0deg)
            scale(.5);

        opacity: 0;
    }

    8% {
        opacity: 1;
    }

    50% {
        opacity: 1;
    }

    100% {
        transform:
            translate3d(var(--moveX), 115vh, 0)
            rotate(720deg)
            scale(var(--scale));

        opacity: .15;
    }
}

/* =========================

        );

    transform-origin: 50% 100%;
}
