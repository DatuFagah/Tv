<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Selamanya ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Georgia, "Times New Roman", serif;
}

/* =========================
   VIDEO
========================= */

#video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
}

/* =========================
   OVERLAY
========================= */

.overlay {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;

    background:
        radial-gradient(
            circle at center,
            rgba(255, 80, 130, 0.05),
            rgba(0, 0, 0, 0.25),
            rgba(0, 0, 0, 0.72)
        );
}

/* Efek cahaya lembut */

.glow {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(255, 120, 170, 0.12),
            transparent 45%
        );

    animation: glow 4s ease-in-out infinite;
}

@keyframes glow {
    0%,100% {
        opacity: .5;
    }

    50% {
        opacity: 1;
    }
}

/* =========================
   TEXT
========================= */

.content {
    position: fixed;
    inset: 0;
    z-index: 5;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;
    color: white;

    padding: 25px;

    pointer-events: none;
}

.small {
    font-size: 14px;
    letter-spacing: 6px;
    text-transform: uppercase;
    opacity: .9;
    margin-bottom: 18px;
}

h1 {
    font-size: clamp(42px, 9vw, 100px);
    font-weight: normal;
    letter-spacing: 3px;

    text-shadow:
        0 0 10px rgba(255,255,255,.7),
        0 0 30px rgba(255,100,160,.7),
        0 0 70px rgba(255,50,130,.5);

    animation: title 3s ease-in-out infinite;
}

.subtitle {
    margin-top: 18px;
    font-size: clamp(15px, 3vw, 25px);
    letter-spacing: 3px;
    max-width: 700px;
    line-height: 1.7;

    text-shadow:
        0 2px 10px #000,
        0 0 20px rgba(255,100,150,.5);
}

@keyframes title {
    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.025);
    }
}

/* =========================
   BUNGA JATUH
========================= */

#flowers {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 20;

    pointer-events: none;

    overflow: hidden;
}

/* Kelopak */

.flower {
    position: absolute;

    top: -70px;

    width: 18px;
    height: 18px;

    background: linear-gradient(
        135deg,
        #fff0f6,
        #ffb6d0 35%,
        #ff4f91 75%,
        #c91d62
    );

    border-radius: 70% 20% 70% 20%;

    opacity: .95;

    box-shadow:
        0 0 6px rgba(255, 120, 170, .9),
        0 0 18px rgba(255, 80, 140, .5);

    animation:
        fall linear forwards,
        sway ease-in-out infinite alternate;
}

/* Bikin variasi bentuk */

.flower::before {
    content: "";

    position: absolute;

    width: 100%;
    height: 100%;

    background: inherit;

    border-radius: inherit;

    transform: rotate(45deg);

    opacity: .85;
}

.flower::after {
    content: "";

    position: absolute;

    width: 4px;
    height: 4px;

    background: #ffd7e5;

    border-radius: 50%;

    left: 7px;
    top: 7px;

    box-shadow:
        0 0 5px #fff,
        0 0 10px #ff9fc2;
}

/* Animasi turun */

@keyframes fall {

    0% {
        transform:
            translate3d(0, -80px, 0)
            rotate(0deg)
            scale(.7);

        opacity: 0;
    }

    8% {
        opacity: 1;
    }

    50% {
        opacity: 1;
    }

    100% {
        transform:
            translate3d(var(--moveX), 115vh, 0)
            rotate(720deg)
            scale(var(--scale));

        opacity: .2;
    }
}

/* Gerakan kiri kanan */

@keyframes sway {

    from {
        margin-left: -35px;
    }

    to {
        margin-left: 35px;
    }
}

/* =========================
   BUNGA BESAR
========================= */

.big-flower {
    position: absolute;

    top: -120px;

    width: 70px;
    height: 70px;

    border-radius: 50%;

    animation: bigFall linear forwards;

    filter:
        drop-shadow(0 0 10px rgba(255,100,150,.8))
        drop-shadow(0 0 25px rgba(255,50,120,.5));
}

/* Petal bunga besar */

.big-flower span {
    position: absolute;

    width: 32px;
    height: 45px;

    left: 19px;
    top: 10px;

    border-radius: 50% 50% 45% 45%;

    background:
        radial-gradient(
            circle at 50% 20%,
            #fff,
            #ffb5ce 25%,
            #ff4c91 65%,
            #bd165b
        );

    transform-origin: 50% 100%;
}

.big-flower span:nth-child(1) {
    transform: rotate(0deg);
}

.big-flower span:nth-child(2) {
    transform: rotate(72deg);
}

.big-flower span:nth-child(3) {
    transform: rotate(144deg);
}

.big-flower span:nth-child(4) {
    transform: rotate(216deg);
}

.big-flower span:nth-child(5) {
    transform: rotate(288deg);
}

/* Tengah bunga */

.big-flower .center {
    position: absolute;

    width: 18px;
    height: 18px;

    left: 26px;
    top: 27px;

    background:
        radial-gradient(
            circle,
            #fff5a8,
            #ffca3a 50%,
            #d87900
        );

    border-radius: 50%;

    z-index: 5;

    box-shadow:
        0 0 8px #fff,
        0 0 20px #ffca70;
}

@keyframes bigFall {

    0% {
        transform:
            translateY(-100px)
            translateX(0)
            rotate(0deg)
            scale(.5);

        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    50% {
        opacity: 1;
    }

    100% {
        transform:
            translateY(120vh)
            translateX(var(--bigX))
            rotate(600deg)
            scale(1);

        opacity: .15;
    }
}

/* =========================
   HATI
========================= */

.heart {
    margin-top: 25px;

    font-family: Arial, sans-serif;
    font-size: 30px;

    text-shadow:
        0 0 10px #ff4f91,
        0 0 30px #ff4f91;

    animation: heartBeat 1.4s infinite;
}

@keyframes heartBeat {

    0%,100% {
        transform: scale(1);
    }

    25% {
        transform: scale(1.18);
    }

    40% {
        transform: scale(1);
    }

    60% {
        transform: scale(1.12);
    }
}

/* =========================
   START SCREEN
========================= */

.start {
    position: fixed;
    inset: 0;

    z-index: 50;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            circle,
            rgba(70,0,30,.35),
            rgba(0,0,0,.9)
        );

    transition: opacity .8s ease;
}

.start-box {
    text-align: center;
    color: white;

    padding: 35px;
}

.start-box h2 {
    font-weight: normal;
    font-size: 28px;
    margin-bottom: 12px;

    text-shadow:
        0 0 20px rgba(255,100,160,.8);
}

.start-box p {
    font-family: Arial, sans-serif;
    font-size: 14px;
    opacity: .7;
    margin-bottom: 25px;
}

.start-button {
    border: 1px solid rgba(255,180,210,.8);

    background:
        linear-gradient(
            135deg,
            rgba(255,80,140,.3),
            rgba(255,30,100,.1)
        );

    color: white;

    padding: 15px 35px;

    border-radius: 50px;

    font-size: 14px;

    letter-spacing: 3px;

    cursor: pointer;

    box-shadow:
        0 0 15px rgba(255,70,130,.4),
        inset 0 0 15px rgba(255,70,130,.15);

    transition: .3s;
}

.start-button:hover {
    transform: scale(1.05);

    box-shadow:
        0 0 30px rgba(255,70,130,.8);
}

.hide {
    opacity: 0;
    pointer-events: none;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    .small {
        font-size: 10px;
        letter-spacing: 4px;
    }

    h1 {
        font-size: 45px;
    }

    .subtitle {
        font-size: 14px;
        letter-spacing: 1px;
    }

    .flower {
        width: 14px;
        height: 14px;
    }

    .big-flower {
        transform: scale(.7);
    }
}
</style>
</head>

<body>

<!-- VIDEO -->
<video id="video" autoplay loop playsinline preload="auto">
    <source src="video.mp4" type="video/mp4">
</video>

<!-- OVERLAY -->
<div class="overlay"></div>
<div class="glow"></div>

<!-- BUNGA -->
<div id="flowers"></div>

<!-- TEXT -->
<div class="content">

    <div class="small">
        Sebuah kisah
    </div>

    <h1>Cinta</h1>

    <div class="subtitle">
        Ada hati yang memilih untuk tetap tinggal,
        <br>
        walau waktu terus berjalan.
    </div>

    <div class="heart">
        ♥
    </div>

</div>

<!-- START -->
<div class="start" id="start">

    <div class="start-box">

        <h2>Untuk Sebuah Cinta</h2>

        <p>
            Tekan untuk memulakan kisah ini
        </p>

        <button class="start-button" id="startButton">
            ✦ MULAKAN ✦
        </button>

    </div>

</div>

<script>

/* =========================
   VIDEO + AUDIO
========================= */

const video = document.getElementById("video");
const start = document.getElementById("start");
const startButton = document.getElementById("startButton");

startButton.addEventListener("click", function() {

    video.muted = false;

    video.play().catch(() => {});

    start.classList.add("hide");

});


/* =========================
   BUNGA JATUH
========================= */

const flowerContainer = document.getElementById("flowers");


function createFlower() {

    const flower = document.createElement("div");

    flower.className = "flower";

    const size =
        Math.random() * 14 + 10;

    const left =
        Math.random() * 100;

    const duration =
        Math.random() * 5 + 6;

    const moveX =
        (Math.random() * 220 - 110) + "px";

    const scale =
        (Math.random() * .8 + .7).toFixed(2);

    const delay =
        Math.random() * -5;

    flower.style.left = left + "%";

    flower.style.width = size + "px";
    flower.style.height = size + "px";

    flower.style.setProperty(
        "--moveX",
        moveX
    );

    flower.style.setProperty(
        "--scale",
        scale
    );

    flower.style.animationDuration =
        duration + "s";

    flower.style.animationDelay =
        delay + "s";

    flowerContainer.appendChild(flower);

    setTimeout(() => {
        flower.remove();
    }, (duration + 6) * 1000);
}


/* =========================
   BUNGA BESAR
========================= */

function createBigFlower() {

    const flower =
        document.createElement("div");

    flower.className = "big-flower";

    for(let i = 0; i < 5; i++) {

        const petal =
            document.createElement("span");

        flower.appendChild(petal);
    }

    const center =
        document.createElement("div");

    center.className = "center";

    flower.appendChild(center);

    const left =
        Math.random() * 100;

    const duration =
        Math.random() * 6 + 8;

    const bigX =
        (Math.random() * 300 - 150) + "px";

    flower.style.left =
        left + "%";

    flower.style.setProperty(
        "--bigX",
        bigX
    );

    flower.style.animationDuration =
        duration + "s";

    flowerContainer.appendChild(flower);

    setTimeout(() => {
        flower.remove();
    }, (duration + 2) * 1000);
}


/* =========================
   MULAKAN BANYAK BUNGA
========================= */

/* Bunga sudah ada sejak halaman dibuka */

for(let i = 0; i < 60; i++) {

    setTimeout(() => {
        createFlower();
    }, i * 80);

}


/* Bunga kecil terus jatuh */

setInterval(() => {

    createFlower();

}, 180);


/* Bunga besar */

setInterval(() => {

    createBigFlower();

}, 900);

</script>

</body>
</html>
