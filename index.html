<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datu Pagah Muzik PRO</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#070707;
color:#fff;
overflow-x:hidden;
}

header{
padding:25px 20px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #222;
position:sticky;
top:0;
background:rgba(7,7,7,.92);
backdrop-filter:blur(15px);
z-index:10;
}

.logo{
font-size:24px;
font-weight:bold;
}

.logo span{
color:#ff0757;
}

.container{
max-width:1100px;
margin:auto;
padding:30px 20px 160px;
}

.hero{
text-align:center;
padding:30px 10px;
}

.hero h1{
font-size:42px;
margin:0;
background:linear-gradient(90deg,#ff0757,#8c00ff);
-webkit-background-clip:text;
color:transparent;
}

.hero p{
color:#888;
}

.search{
margin:25px auto;
max-width:600px;
}

.search input{
width:100%;
padding:17px 20px;
border-radius:30px;
border:1px solid #333;
background:#151515;
color:white;
outline:none;
font-size:16px;
}

.section-title{
margin-top:35px;
display:flex;
justify-content:space-between;
align-items:center;
}

.section-title h2{
margin:0;
}

.music-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:18px;
margin-top:20px;
}

.card{
background:#121212;
border-radius:15px;
padding:12px;
cursor:pointer;
transition:.25s;
}

.card:hover{
transform:translateY(-5px);
background:#1d1d1d;
}

.card img{
width:100%;
aspect-ratio:1;
object-fit:cover;
border-radius:10px;
}

.card h3{
font-size:15px;
margin:12px 0 5px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.card p{
font-size:13px;
color:#888;
margin:0;
}

.bottom-player{
position:fixed;
bottom:0;
left:0;
right:0;
background:rgba(15,15,15,.96);
border-top:1px solid #333;
backdrop-filter:blur(20px);
padding:12px 20px;
z-index:20;
}

.player{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
gap:18px;
}

.now{
width:220px;
display:flex;
align-items:center;
gap:10px;
}

.now img{
width:55px;
height:55px;
border-radius:8px;
object-fit:cover;
}

.now div{
overflow:hidden;
}

.now strong{
display:block;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.now small{
color:#888;
}

.controls{
display:flex;
align-items:center;
gap:10px;
}

.controls button{
border:0;
background:#222;
color:#fff;
width:42px;
height:42px;
border-radius:50%;
cursor:pointer;
font-size:17px;
}

.controls button:hover{
background:#ff0757;
}

.play{
background:#ff0757!important;
}

.bar{
flex:1;
}

#progress{
width:100%;
accent-color:#ff0757;
}

.volume{
width:120px;
}

#volume{
width:100%;
accent-color:#ff0757;
}

@media(max-width:700px){

header{
padding:18px;
}

.hero h1{
font-size:32px;
}

.music-grid{
grid-template-columns:repeat(2,1fr);
}

.player{
gap:8px;
}

.now{
width:auto;
flex:1;
}

.controls button{
width:38px;
height:38px;
}

.volume{
display:none;
}

}

@media(max-width:450px){

.now img{
width:45px;
height:45px;
}

.now{
font-size:12px;
}

.bar{
display:none;
}

}
</style>
</head>

<body>

<header>
<div class="logo">
🎵 Datu <span>Pagah</span> Muzik
</div>
</header>

<div class="container">

<section class="hero">

<h1>Datu Pagah Muzik</h1>

<p>Music for every moment.</p>

<div class="search">

<input
id="search"
placeholder="🔎 Cari lagu atau artis..."
>

</div>

</section>

<div class="section-title">
<h2>🔥 Muzik Pilihan</h2>
</div>

<div id="music" class="music-grid">

<p>Memuatkan muzik...</p>

</div>

</div>


<div class="bottom-player">

<div class="player">

<div class="now">

<img id="nowCover"
src="https://images.unsplash.com/photo-1511379938547-c1f69419868d?w=200"
>

<div>

<strong id="nowTitle">
Pilih lagu
</strong>

<small id="nowArtist">
Datu Pagah Muzik
</small>

</div>

</div>


<div class="controls">

<button onclick="previous()">⏮</button>

<button
id="playButton"
class="play"
onclick="togglePlay()"
>
▶
</button>

<button onclick="next()">⏭</button>

</div>


<div class="bar">

<input
type="range"
id="progress"
value="0"
min="0"
max="100"
>

</div>


<div class="volume">

<input
type="range"
id="volume"
min="0"
max="1"
step="0.01"
value="1"
>

</div>

</div>

</div>


<audio id="audio"></audio>


<script>

/* =====================================
