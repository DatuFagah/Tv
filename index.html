<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY TV Malaysia</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    width:100%;
    max-width:1000px;
    margin:auto;
    padding:15px;
}

.tv{
    background:linear-gradient(145deg,#3b3b3b,#111);
    border:9px solid #252525;
    border-radius:28px;
    padding:15px;
    box-shadow:0 0 0 3px #555,0 20px 50px #000;
}

.screen{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    overflow:hidden;
    border-radius:8px;
}

.screen iframe{
    width:100%;
    height:100%;
    border:none;
}

.live{
    position:absolute;
    top:12px;
    left:12px;
    z-index:10;
    background:red;
    padding:7px 11px;
    border-radius:6px;
    font-weight:bold;
    font-size:13px;
}

.info{
    background:#101010;
    padding:14px;
    font-size:20px;
    font-weight:bold;
}

.tv-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 5px 0;
}

.brand{
    font-size:22px;
    font-weight:bold;
}

.brand span{
    color:#00bfff;
}

.power{
    width:13px;
    height:13px;
    background:red;
    border-radius:50%;
    box-shadow:0 0 15px red;
}

.title{
    margin-top:30px;
    font-size:27px;
    font-weight:bold;
}

.channels{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-top:18px;
}

.channel{
    background:#151515;
    border:2px solid #292929;
    border-radius:15px;
    padding:20px 10px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.channel:hover{
    border-color:#00bfff;
    transform:translateY(-3px);
}

.channel.active{
    border-color:#00bfff;
    box-shadow:0 0 20px rgba(0,191,255,.25);
}

.icon{
    font-size:35px;
    margin-bottom:8px;
}

.name{
    font-size:18px;
    font-weight:bold;
}

.badge{
    display:inline-block;
    margin-top:10px;
    padding:5px 9px;
    background:red;
    border-radius:5px;
    font-size:11px;
}

@media(max-width:600px){

    .container{
        padding:8px;
    }

    .tv{
        border-width:7px;
        border-radius:22px;
        padding:8px;
    }

    .channels{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .title{
        font-size:24px;
    }

    .channel{
        padding:17px 5px;
    }

    .name{
        font-size:16px;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="tv">

<div class="screen">

<div class="live">
● LIVE
</div>

<iframe
id="player"
src="https://rtmklik.rtm.gov.my/live/khas/tv1"
allow="autoplay; fullscreen"
allowfullscreen>
</iframe>

</div>

<div class="info" id="channelName">
🇲🇾 TV1
</div>

<div class="tv-bottom">

<div class="brand">
MY <span>TV</span>
</div>

<div class="power"></div>

</div>

</div>

<div class="title">
📺 Saluran Malaysia
</div>

<div class="channels">

<div class="channel active"
onclick="changeChannel(
'TV1',
'https://rtmklik.rtm.gov.my/live/khas/tv1',
this)">

<div class="icon">🇲🇾</div>
<div class="name">TV1</div>
<div class="badge">LIVE</div>

</div>


<div class="channel"
onclick="changeChannel(
'TV2',
'https://rtmklik.rtm.gov.my/live/khas/tv2',
this)">

<div class="icon">🇲🇾</div>
<div class="name">TV2</div>
<div class="badge">LIVE</div>

</div>


<div class="channel"
onclick="changeChannel(
'TV OKEY',
'https://rtmklik.rtm.gov.my/live/khas/okey',
this)">

<div class="icon">🇲🇾</div>
<div class="name">TV OKEY</div>
<div class="badge">LIVE</div>

</div>


<div class="channel"
onclick="changeChannel(
'BERITA RTM',
'https://rtmklik.rtm.gov.my/live/tv/berita',
this)">

<div class="icon">📰</div>
<div class="name">BERITA RTM</div>
<div class="badge">LIVE</div>

</div>


<div class="channel"
onclick="changeChannel(
'SUKAN RTM',
'https://rtmklik.rtm.gov.my/live/tv/sukan',
this)">

<div class="icon">⚽</div>
<div class="name">SUKAN RTM</div>
<div class="badge">LIVE</div>

</div>


<div class="channel"
onclick="changeChannel(
'TV6',
'https://rtmklik.rtm.gov.my/live/tv/tv6',
this)">

<div class="icon">📺</div>
<div class="name">TV6</div>
<div class="badge">LIVE</div>

</div>

</div>

</div>

<script>

function changeChannel(name,url,button){

document.getElementById("player").src=url;

document.getElementById("channelName").innerHTML=
"🇲🇾 "+name;

document.querySelectorAll(".channel").forEach(function(channel){

channel.classList.remove("active");

});

button.classList.add("active");

window.scrollTo({
top:0,
behavior:"smooth"
});

}

</script>

</body>
</html>
