<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dibuat Rindu ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

/* =========================
   VIDEO AUTO PLAY
========================= */

#video{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:1;
}

/* =========================
   DARK CINEMATIC
========================= */

.overlay{
    position:fixed;
    inset:0;

    z-index:2;
    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.25),
            rgba(0,0,0,.15),
            rgba(0,0,0,.65)
        );
}

/* Cahaya lembut */

.glow{
    position:fixed;
    inset:0;

    z-index:3;
    pointer-events:none;

    background:
        radial-gradient(
            circle at center,
            rgba(255,80,140,.18),
            transparent 45%
        );

    animation:
        glowMove 5s ease-in-out infinite;
}

@keyframes glowMove{

    0%,100%{
        opacity:.45;
        transform:scale(1);
    }

    50%{
        opacity:1;
        transform:scale(1.08);
    }
}

/* =========================
   TEKS
========================= */

.content{
    position:fixed;
    inset:0;

    z-index:8;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;

    padding:25px;

    color:white;

    pointer-events:none;
}

.small{
    font-family:Arial,sans-serif;

    font-size:12px;

    letter-spacing:7px;

    text-transform:uppercase;

    opacity:.85;

    margin-bottom:20px;

    text-shadow:
        0 0 15px rgba(255,120,170,.8);
}

h1{
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(50px,12vw,110px);

    font-weight:normal;

    letter-spacing:5px;

    text-shadow:
        0 0 10px rgba(255,255,255,.8),
        0 0 30px rgba(255,80,150,.9),
        0 0 70px rgba(255,30,120,.7);

    animation:
        titleGlow 3s ease-in-out infinite;
}

.subtitle{
    margin-top:25px;

    max-width:800px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(16px,3vw,25px);

    line-height:1.8;

    letter-spacing:1px;

    text-shadow:
        0 2px 10px #000,
        0 0 20px rgba(255,80,140,.7);
}

.heart{
    margin-top:25px;

    font-family:Arial,sans-serif;

    font-size:34px;

    color:#ff5b99;

    text-shadow:
        0 0 10px #ff4f91,
        0 0 30px #ff4f91,
        0 0 60px #ff4f91;

    animation:
        heartbeat 1.4s infinite;
}

@keyframes titleGlow{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.025);
    }
}

@keyframes heartbeat{

    0%,100%{
        transform:scale(1);
    }

    20%{
        transform:scale(1.2);
    }

    40%{
        transform:scale(1);
    }

    60%{
        transform:scale(1.12);
    }
}

/* =========================
   BUNGA
========================= */

#flowers{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    z-index:20;

    overflow:hidden;

    pointer-events:none;
}

/* Kelopak */

.flower{
    position:absolute;

    top:-60px;

    width:18px;
    height:18px;

    border-radius:
        80% 20% 80% 20%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #fff,
            #ffd2e1 18%,
            #ff8db5 45%,
            #ff3f82 75%,
            #bd1556
        );

    box-shadow:
        0 0 6px rgba(255,180,210,.9),
        0 0 18px rgba(255,60,130,.8);

    opacity:.95;

    animation:
        falling var(--duration) linear forwards;
}

/* Kelopak kedua */

.flower::before{
    content:"";

    position:absolute;

    width:100%;
    height:100%;

    left:7px;
    top:0;

    border-radius:
        80% 20% 80% 20%;

    background:
        linear-gradient(
            135deg,
            #ffd9e7,
            #ff4f91
        );

    transform:rotate(55deg);

    opacity:.8;
}

/* Titik tengah */

.flower::after{
    content:"";

    position:absolute;

    width:4px;
    height:4px;

    border-radius:50%;

    left:7px;
    top:7px;

    background:#fff5c7;

    box-shadow:
        0 0 6px white,
        0 0 12px #ffc1d8;
}

@keyframes falling{

    0%{
        transform:
            translate3d(0,-80px,0)
            rotate(0deg)
            scale(.6);

        opacity:0;
    }

    8%{
        opacity:1;
    }

    50%{
        opacity:1;
    }

    100%{
        transform:
            translate3d(var(--x),115vh,0)
            rotate(720deg)
            scale(var(--scale));

        opacity:.15;
    }
}

/* =========================
   BUNGA BESAR
========================= */

.bigFlower{
    position:absolute;

    top:-100px;

    width:70px;
    height:70px;

    animation:
        bigFalling var(--bigDuration) linear forwards;

    filter:
        drop-shadow(0 0 12px rgba(255,100,160,.9))
        drop-shadow(0 0 30px rgba(255,60,130,.6));
}

.bigFlower span{
    position:absolute;

    width:30px;
    height:45px;

    left:20px;
    top:8px;

    border-radius:50% 50% 45% 45%;

    background:
        radial-gradient(
            circle at 50% 15%,
            #fff,
            #ffc2d8 25%,
            #ff4d91 65%,
            #b91455
        );

    transform-origin:
        50% 100%;
}

.bigFlower span:nth-child(1){
    transform:rotate(0deg);
}

.bigFlower span:nth-child(2){
    transform:rotate(72deg);
}

.bigFlower span:nth-child(3){
    transform:rotate(144deg);
}

.bigFlower span:nth-child(4){
    transform:rotate(216deg);
}

.bigFlower span:nth-child(5){
    transform:rotate(288deg);
}

.bigFlower .center{
    position:absolute;

    left:26px;
    top:27px;

    width:18px;
    height:18px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #fffbd0,
            #ffd447,
            #d88700
        );

    z-index:5;

    box-shadow:
        0 0 8px white,
        0 0 20px #ffc857;
}

@keyframes bigFalling{

    0%{
        transform:
            translateY(-100px)
            translateX(0)
            rotate(0deg)
            scale(.4);

        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{
        transform:
            translateY(120vh)
            translateX(var(--bigX))
            rotate(700deg)
            scale(1);

        opacity:.1;
    }
}

/* =========================
   PARTIKEL CAHAYA
========================= */

.light{
    position:absolute;

    width:4px;
    height:4px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 8px white,
        0 0 18px #ff8eb5;

    animation:
        lightMove var(--lightDuration) linear forwards;
}

@keyframes lightMove{

    0%{
        transform:
            translateY(110vh)
            scale(.3);

        opacity:0;
    }

    20%{
        opacity:.8;
    }

    80%{
        opacity:.5;
    }

    100%{
        transform:
            translateY(-20vh)
            scale(1);

        opacity:0;
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .small{
        font-size:9px;
        letter-spacing:5px;
    }

    h1{
        font-size:52px;
    }

    .subtitle{
        font-size:16px;
        line-height:1.7;
    }

    .heart{
        font-size:30px;
    }

    .flower{
        width:14px;
        height:14px;
    }

    .bigFlower{
        transform:scale(.7);
    }
}
</style>
</head>

<body>

<!-- =========================
     VIDEO
========================= -->

<video
    id="video"
    autoplay
    muted
    loop
    playsinline
    webkit-playsinline
    preload="auto">

    <source src="video.mp4" type="video/mp4">

</video>


<!-- =========================
     EFFECT
========================= -->

<div class="overlay"></div>
<div class="glow"></div>

<div id="flowers"></div>


<!-- =========================
     TEXT
========================= -->

<div class="content">

    <div class="small">
        Sebuah perasaan
    </div>

    <h1>Rindu</h1>

    <div class="subtitle">
        Dibuat rindu oleh perasaan,
        <br>
        dilarang bertemu oleh keadaan,
        <br>
        dan dilarang bersatu oleh kenyataan.
    </div>

    <div class="heart">
        ♥
    </div>

</div>


<script>

/* ==================================
   PAKSA VIDEO MULAI SECEPAT MUNGKIN
================================== */

const video =
    document.getElementById("video");

video.muted = true;

const playVideo = () => {

    video.play().catch(() => {});

};

playVideo();

document.addEventListener(
    "DOMContentLoaded",
    playVideo
);

window.addEventListener(
    "load",
    playVideo
);


/* ==================================
   BUNGA JATUH
================================== */

const flowers =
    document.getElementById("flowers");


function createFlower(){

    const flower =
        document.createElement("div");

    flower.className = "flower";

    const size =
        Math.random() * 15 + 10;

    const duration =
        Math.random() * 5 + 6;

    const x =
        Math.random() * 260 - 130;

    const scale =
        Math.random() * .8 + .7;

    flower.style.left =
        Math.random() * 100 + "%";

    flower.style.width =
        size + "px";

    flower.style.height =
        size + "px";

    flower.style.setProperty(
        "--x",
        x + "px"
    );

    flower.style.setProperty(
        "--scale",
        scale
    );

    flower.style.setProperty(
        "--duration",
        duration + "s"
    );

    flowers.appendChild(flower);

    setTimeout(
        () => flower.remove(),
        (duration + 1) * 1000
    );
}


/* ==================================
   BUNGA BESAR
================================== */

function createBigFlower(){

    const flower =
        document.createElement("div");

    flower.className =
        "bigFlower";

    for(let i=0;i<5;i++){

        const petal =
            document.createElement("span");

        flower.appendChild(petal);
    }

    const center =
        document.createElement("div");

    center.className = "center";

    flower.appendChild(center);

    flower.style.left =
        Math.random() * 100 + "%";

    flower.style.setProperty(
        "--bigX",
        (Math.random() * 350 - 175) + "px"
    );

    const duration =
        Math.random() * 5 + 8;

    flower.style.setProperty(
        "--bigDuration",
        duration + "s"
    );

    flowers.appendChild(flower);

    setTimeout(
        () => flower.remove(),
        (duration + 1) * 1000
    );
}


/* ==================================
   BANYAK BUNGA DARI AWAL
================================== */

for(let i=0;i<70;i++){

    setTimeout(
        createFlower,
        i * 60
    );
}


/* Bunga kecil terus turun */

setInterval(
    createFlower,
    150
);


/* Bunga besar */

setInterval(
    createBigFlower,
    1000
);


/* ==================================
   CAHAYA BERKILAU
================================== */

function createLight(){

    const light =
        document.createElement("div");

    light.className = "light";

    light.style.left =
        Math.random() * 100 + "%";

    const duration =
        Math.random() * 5 + 5;

    light.style.setProperty(
        "--lightDuration",
        duration + "s"
    );

    flowers.appendChild(light);

    setTimeout(
        () => light.remove(),
        (duration + 1) * 1000
    );
}

setInterval(
    createLight,
    350
);

</script>

</body>
</html>
