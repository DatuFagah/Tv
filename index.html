<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY TV Malaysia</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
}

/* HEADER */

header{
    text-align:center;
    padding:22px 10px;
    background:#101010;
    border-bottom:1px solid #222;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:8px 0 0;
    color:#888;
}

/* CONTAINER */

.container{
    width:100%;
    max-width:1000px;
    margin:auto;
    padding:12px;
}

/* TV */

.tv{
    background:linear-gradient(145deg,#444,#111);
    border:8px solid #292929;
    border-radius:25px;
    padding:12px;
    box-shadow:
        0 0 0 3px #555,
        0 20px 50px #000;
}

/* SCREEN */

.screen{
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:8px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.screen-content h2{
    font-size:30px;
    margin:0 0 12px;
}

.screen-content p{
    color:#aaa;
    margin-bottom:20px;
}

/* BUTTON WATCH */

.watch{
    display:inline-block;
    padding:13px 25px;
    background:#e60000;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
    font-size:16px;
}

.watch:hover{
    background:#ff2020;
}

/* LIVE */

.live{
    position:absolute;
    margin-top:-170px;
    margin-left:-400px;

    background:red;
    padding:7px 10px;
    border-radius:5px;

    font-weight:bold;
    font-size:12px;
}

/* CHANNEL NAME */

.channel-name{
    background:#111;
    padding:14px;

    font-size:20px;
    font-weight:bold;
}

/* TV FOOTER */

.tv-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:12px 5px 2px;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.logo span{
    color:#00bfff;
}

.power{
    width:13px;
    height:13px;

    background:red;
    border-radius:50%;

    box-shadow:0 0 15px red;
}

/* TITLE */

.title{
    margin-top:30px;
    font-size:25px;
    font-weight:bold;
}

/* CHANNELS */

.channels{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;

    margin-top:18px;
}

.channel{
    background:#151515;

    border:2px solid #292929;
    border-radius:14px;

    padding:20px 10px;

    text-align:center;

    cursor:pointer;

    transition:.2s;
}

.channel:hover{
    border-color:#00bfff;
    transform:translateY(-3px);
}

.channel.active{
    border-color:#00bfff;
    box-shadow:0 0 18px rgba(0,191,255,.3);
}

.icon{
    font-size:35px;
}

.name{
    margin-top:8px;
    font-weight:bold;
    font-size:17px;
}

.badge{
    display:inline-block;

    margin-top:9px;

    background:red;

    padding:5px 9px;

    border-radius:5px;

    font-size:10px;
}

/* MOBILE */

@media(max-width:600px){

    header h1{
        font-size:25px;
    }

    .container{
        padding:8px;
    }

    .tv{
        border-width:6px;
        padding:7px;
        border-radius:20px;
    }

    .channels{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .title{
        font-size:23px;
    }

    .name{
        font-size:15px;
    }

    .live{
        margin-left:-160px;
    }

}

</style>
</head>

<script>

function openTV(name,url,button){

/* tukar nama */

document.getElementById(
"channelName"
).innerHTML =
"🇲🇾 " + name;


/* tukar tulisan */

document.getElementById(
"screenText"
).innerHTML =
"Anda sedang membuka siaran rasmi " +
name;


/* tampilkan button */

let btn =
document.getElementById(
"watchButton"
);

btn.style.display="inline-block";

btn.href=url;


/* active */

document
.querySelectorAll(".channel")
.forEach(function(item){

item.classList.remove("active");

});

button.classList.add("active");


/* buka player rasmi */

window.location.href=url;

}

</script>
