<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Rindu — Sebuah Perasaan</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Great+Vibes&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050308;
}

body{
    font-family:'Cormorant Garamond',serif;
}

/* VIDEO */

#video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:1;
    background:#050308;
}

/* DARK CINEMATIC */

.overlay{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.28),
            rgba(0,0,0,.05) 40%,
            rgba(0,0,0,.58)
        ),
        radial-gradient(
            ellipse at center,
            rgba(255,150,190,.08),
            transparent 65%
        );
}

/* VIGNETTE */

.vignette{
    position:fixed;
    inset:0;
    z-index:3;
    pointer-events:none;

    box-shadow:
        inset 0 0 160px rgba(0,0,0,.95),
        inset 0 0 60px rgba(0,0,0,.65);
}

/* SOFT LIGHT */

.glow{
    position:fixed;
    width:500px;
    height:500px;
    border-radius:50%;

    background:radial-gradient(
        circle,
        rgba(255,120,175,.11),
        transparent 70%
    );

    filter:blur(30px);
    pointer-events:none;
    z-index:4;

    animation:glowMove 12s ease-in-out infinite alternate;
}

.glow.left{
    left:-250px;
    top:20%;
}

.glow.right{
    right:-250px;
    bottom:5%;
    animation-delay:5s;
}

@keyframes glowMove{
    from{
        transform:translate(0,0) scale(1);
    }

    to{
        transform:translate(80px,-50px) scale(1.2);
    }
}

/* CONTENT */

.content{
    position:fixed;
    inset:0;
    z-index:20;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:25px;
    pointer-events:none;
}

.text-box{
    width:min(950px,100%);

    opacity:0;

    animation:
        appear 2.8s ease forwards,
        floating 8s ease-in-out 3s infinite;
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(30px);
        filter:blur(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
        filter:blur(0);
    }
}

@keyframes floating{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-7px);
    }
}

/* SMALL TITLE */

.subtitle{
    font-family:'Playfair Display',serif;

    font-size:clamp(12px,1.6vw,19px);

    font-weight:400;

    letter-spacing:9px;

    text-transform:uppercase;

    color:#f9d8e5;

    margin-bottom:4px;

    text-shadow:
        0 0 12px rgba(255,180,210,.55);
}

/* MAIN TITLE */

.title{
    font-family:'Great Vibes',cursive;

    font-size:clamp(90px,15vw,190px);

    font-weight:400;

    line-height:.95;

    margin-bottom:30px;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #ffeaf3 38%,
            #f5a9c9 72%,
            #d66b9d 100%
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    filter:
        drop-shadow(0 0 8px rgba(255,255,255,.7))
        drop-shadow(0 0 25px rgba(255,120,175,.55))
        drop-shadow(0 0 55px rgba(255,70,150,.25));

    animation:titleGlow 4s ease-in-out infinite;
}

@keyframes titleGlow{
    0%,100%{
        filter:
            drop-shadow(0 0 8px rgba(255,255,255,.7))
            drop-shadow(0 0 25px rgba(255,120,175,.5))
            drop-shadow(0 0 55px rgba(255,70,150,.2));
    }

    50%{
        filter:
            drop-shadow(0 0 12px rgba(255,255,255,.9))
            drop-shadow(0 0 35px rgba(255,150,200,.7))
            drop-shadow(0 0 70px rgba(255,70,150,.35));
    }
}

/* DECORATIVE LINE */

.line{
    width:110px;
    height:1px;

    margin:0 auto 25px;

    background:linear-gradient(
        90deg,
        transparent,
        #e9a6c2,
        #fff,
        #e9a6c2,
        transparent
    );

    box-shadow:
        0 0 8px rgba(255,180,210,.7);
}

/* QUOTE */

.quote{
    font-family:'Cormorant Garamond',serif;

    font-size:clamp(21px,3vw,34px);

    font-weight:400;

    font-style:italic;

    line-height:1.45;

    color:#fff3f8;

    text-shadow:
        0 2px 10px rgba(0,0,0,.95),
        0 0 15px rgba(255,170,205,.3);
}

.quote .pink{
    color:#f4b4cd;
}

.quote .gold{
    color:#efd9a7;
}

/* HEART */

.heart{
    margin-top:27px;

    font-family:serif;

    font-size:22px;

    color:#efabc7;

    text-shadow:
        0 0 8px rgba(255,130,180,.8),
        0 0 25px rgba(255,80,150,.55);

    animation:heartbeat 2s ease-in-out infinite;
}

@keyframes heartbeat{
    0%,100%{
        transform:scale(1);
        opacity:.75;
    }

    50%{
        transform:scale(1.2);
        opacity:1;
    }
}

/* FLOWER CONTAINER */

#flowers{
    position:fixed;
    inset:0;

    z-index:10;

    overflow:hidden;

    pointer-events:none;
}

/* ONLY A FEW FLOWERS */

.flower{
    position:absolute;

    width:16px;
    height:16px;

    opacity:.65;

    animation:fall linear forwards;

    filter:
        drop-shadow(0 0 5px rgba(255,160,200,.6));
}

.flower::before{
    content:"✿";

    position:absolute;

    font-size:19px;

    line-height:1;

    color:#f4a7c5;

    text-shadow:
        0 0 5px #fff,
        0 0 13px rgba(255,120,180,.7);
}

@keyframes fall{
    0%{
        transform:
            translateY(-50px)
            rotate(0deg);
    }

    100%{
        transform:
            translateY(110vh)
            rotate(360deg);
    }
}

/* TINY LIGHT PARTICLES */

.sparkle{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 6px #fff,
        0 0 13px rgba(255,180,210,.8);

    animation:sparkle 2.5s ease-in-out forwards;
}

@keyframes sparkle{
    0%{
        opacity:0;
        transform:scale(0);
    }

    40%{
        opacity:.9;
        transform:scale(1.5);
    }

    100%{
        opacity:0;
        transform:scale(0);
    }
}

/* PLAY BUTTON */

#playButton{
    position:fixed;

    left:50%;
    bottom:38px;

    transform:translateX(-50%);

    z-index:100;

    padding:14px 30px;

    border:1px solid rgba(255,210,225,.45);

    border-radius:50px;

    background:rgba(10,5,10,.48);

    backdrop-filter:blur(14px);

    color:#ffeaf3;

    font-family:'Playfair Display',serif;

    font-size:14px;

    letter-spacing:3px;

    cursor:pointer;

    box-shadow:
        0 0 25px rgba(255,100,160,.25);

    transition:.3s;
}

#playButton:hover{
    transform:translateX(-50%) scale(1.05);

    background:rgba(255,100,160,.16);

    box-shadow:
        0 0 35px rgba(255,100,160,.5);
}

#playButton.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

/* MOBILE */

@media(max-width:600px){

    .subtitle{
        font-size:12px;
        letter-spacing:6px;
    }

    .title{
        font-size:90px;
        margin-bottom:22px;
    }

    .line{
        width:80px;
        margin-bottom:20px;
    }

    .quote{
        font-size:21px;
        padding:0 8px;
    }

    .heart{
        margin-top:20px;
    }

    #playButton{
        bottom:25px;
        padding:12px 25px;
    }
}

</style>
</head>

<body>

<video
    id="video"
    autoplay
    loop
    playsinline
    webkit-playsinline
    preload="auto"
>
    <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>
<div class="vignette"></div>

<div class="glow left"></div>
<div class="glow right"></div>

<div id="flowers"></div>

<div class="content">

    <div class="text-box">

        <div class="subtitle">
            Sebuah Perasaan
        </div>

        <div class="title">
            Rindu
        </div>

        <div class="line"></div>

        <div class="quote">
            Dibuat <span class="pink">rindu</span> oleh perasaan,
            <br>
            Dilarang bertemu oleh <span class="gold">keadaan</span>,
            <br>
            dan dilarang bersatu oleh kenyataan.
        </div>

        <div class="heart">
            ♥
        </div>

    </div>

</div>

<button id="playButton" class="hidden">
    ▶ &nbsp; PLAY VIDEO
</button>

<script>

const video = document.getElementById("video");
const flowers = document.getElementById("flowers");
const playButton = document.getElementById("playButton");


/* VIDEO */

async function startVideo(){

    try{

        video.muted = false;

        await video.play();

        playButton.classList.add("hidden");

    }catch(error){

        video.muted = true;

        try{
            await video.play();
        }catch(e){}

        playButton.classList.remove("hidden");
    }
}


/* BUTTON */

playButton.addEventListener("click",async()=>{

    video.muted = false;

    try{
        await video.play();
    }catch(e){
        video.play();
    }

    playButton.classList.add("hidden");

});


/* FLOWERS */

function createFlower(){

    const flower=document.createElement("div");

    flower.className="flower";

    flower.style.left=
        Math.random()*100+"vw";

    const duration=
        Math.random()*7+9;

    flower.style.animationDuration=
        duration+"s";

    flower.style.animationDelay=
        Math.random()*2+"s";

    flowers.appendChild(flower);

    setTimeout(()=>{
        flower.remove();
    },(duration+3)*1000);
}


/*
    HANYA 14 BUNGA DI AWAL
    Supaya tidak memenuhi skrin.
*/

for(let i=0;i<14;i++){
    createFlower();
}


/*
    Hanya satu bunga setiap
    1.2 saat.
*/

setInterval(()=>{
    createFlower();
},1200);


/* SPARKLES */

function createSparkle(){

    const sparkle=
        document.createElement("div");

    sparkle.className="sparkle";

    sparkle.style.left=
        Math.random()*100+"vw";

    sparkle.style.top=
        Math.random()*100+"vh";

    flowers.appendChild(sparkle);

    setTimeout(()=>{
        sparkle.remove();
    },2500);
}


/* Sedikit sahaja cahaya */

setInterval(()=>{
    createSparkle();
},700);


/* START */

window.addEventListener("load",()=>{
    startVideo();
});

</script>

</body>
</html>
